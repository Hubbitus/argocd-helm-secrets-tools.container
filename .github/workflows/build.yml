name: build-and-publish

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: docker.io/hubbitus/argocd-helm-secrets-tools

jobs:
  verify-upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Verify helm-secrets provenance
        run: |
          set -euo pipefail
          curl -fsSL -o secrets-4.7.8.tgz \
            https://github.com/jkroepke/helm-secrets/releases/download/v4.7.8/secrets-4.7.8.tgz
          curl -fsSL -o secrets-4.7.8.tgz.prov \
            https://github.com/jkroepke/helm-secrets/releases/download/v4.7.8/secrets-4.7.8.tgz.prov
          gpg --batch --import keys/jkroepke.asc
          # The clearsigned .prov contains YAML lines starting with dashes;
          # gpg exits non-zero while still reporting the signature status.
          gpg --verify secrets-4.7.8.tgz.prov > gpg.out 2>&1 || true
          grep -q "Good signature" gpg.out
          grep -q "1F34F95B4F30BC5B06E0D7CC3F619F17002790D8" gpg.out
          expected=$(awk '/secrets-4.7.8.tgz: sha256:/ {sub(/.*sha256:/, ""); print}' secrets-4.7.8.tgz.prov)
          actual=$(sha256sum secrets-4.7.8.tgz | awk '{print $1}')
          [ "${expected}" = "${actual}" ]

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Verify sops checksums signature
        run: |
          set -euo pipefail
          curl -fsSL -o sops-v3.13.3.checksums.txt \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.checksums.txt
          curl -fsSL -o sops-v3.13.3.checksums.sigstore.json \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.checksums.sigstore.json
          cosign verify-blob \
            --bundle sops-v3.13.3.checksums.sigstore.json \
            --certificate-identity-regexp '^https://github.com/getsops/sops/.github/workflows/release.yml@refs/tags/v3.13.3$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            sops-v3.13.3.checksums.txt

  build:
    runs-on: ubuntu-24.04
    needs: verify-upstream
    permissions:
      contents: read
      id-token: write   # cosign keyless
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=1.0.0,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      # Docker Hub access tokens with only push scope cannot PATCH repository
      # metadata. If this step fails, update the description manually or use a
      # token/password with repository admin permission.
      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: hubbitus/argocd-helm-secrets-tools
          readme-filepath: ./README.md

  smoke:
    runs-on: ubuntu-24.04
    needs: []
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build image (amd64, load)
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: argocd-helm-secrets-tools:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy tools out of image
        run: |
          mkdir -p /tmp/tools
          docker run --rm -e TARGET_DIR=/tmp/out -v /tmp/tools:/tmp/out argocd-helm-secrets-tools:smoke

      - name: Verify binaries
        run: |
          set -euo pipefail
          /tmp/tools/bin/sops --version | grep -q '3.13.3'
          /tmp/tools/bin/age --version | grep -q 'v1.3.2'
          /tmp/tools/bin/age-keygen --version | grep -q 'v1.3.2'
          test -x /tmp/tools/bin/helm
          test -f /tmp/tools/secrets/plugin.yaml
          echo "all tools present"
